# ==============================================================================
# AI 执行流程管控 · 门禁阈值配置 (Gate Thresholds)
# ==============================================================================
# 这是你唯一需要手改的调参文件。改完立即生效，无需重启任何东西。
# 语义：门禁是"累积"的 —— 必须按 G0→G1→G2→G3→G4 顺序全部通过，才算可执行。
# ==============================================================================

# ── G0 会话命名门禁 ────────────────────────────────────────────────────────────
# 是否强制要求会话命名合规（调用 scripts/check_task_naming.sh --exit 判定）
# 为 true 时，未命名或命名不合规将直接阻断 execAllowed，无法执行改动操作
G0_NAMING_ENFORCE=true

# ── G1 项目初始化 ────────────────────────────────────────────────────────────
# 判定时跳过的一级目录（不作为"需要有主"的检查对象）
G1_SKIP_DIRS=".git .dsh_locks ai-control"

# ── G2 工程结构化 ────────────────────────────────────────────────────────────
# 允许的散落垃圾文件数（.DS_Store / *.tmp / ~$* / *.swp / *.bak）
G2_ORPHAN_MAX=0
# 允许的无标题 Markdown 文件数（空文件豁免）
G2_UNTITLED_MAX=2

# ── G3 需求文档同步 ──────────────────────────────────────────────────────────
# 台账文件（相对项目根）
G3_LEDGER="docs/requirements.md"
# 允许的最大未提交变更数。超过即判定"文档未同步入库"。
# 建议：日常开发设 30；发布前收紧到 0。
G3_DIRTY_LIMIT=30

# ── G4 冗余检测 ──────────────────────────────────────────────────────────────
# 扫描范围（相对项目根的一级目录）
# skill-pool 是合并进来的技能池主体（518 个文件、188 个执行层、全部需求台账）。
# 不含它的时候，GCM 看板会显示 100%，但那份 100% 只覆盖了本工程自己的 81 个文件——
# 一个只检查 13% 文件却报满分的门禁，比不检查更危险。
G4_SCAN_DIRS="rules knowledge indexes docs templates memory skill-pool"
# 排除表：按内容性质排除"模板型台账"。需求台账 40+ 条共用同一字段模板，
# 天然产生大量重复字段名，属于设计意图而非冗余，因此排除。
G4_EXCLUDE_GLOBS="docs/requirements.md"
# 高相似块对上限。判定由 scripts/redundancy_scan.mjs 完成：
#   块级切分 → 归一化（抹掉版本/日期/数字/文件名）→ 词级 Jaccard ≥ 0.85
# 该检测器内置元数据块过滤，能区分"模板结构"与"真复制粘贴"。
# 实测校准：修好假阳性后本仓库为 0。若你确实引入重复内容，此处会上升。
G4_DUP_PAIRS=0

# ── G4 模板标题豁免（PKG-009 / REQ-GCM-GAPFIX-041）─────────────────────────────
# 技能池契约（enforce-contract-completeness）**强制**每份 SKILL.md/README.md 使用同一组章节标题。
# 不豁免它们时，「重复标题」会把契约本身判成冗余：实测合并后该指标由 10 飙到 69（限 12）——
# 全是 171 个 ## Overview、125 个 ## Usage & Script 这类**被要求存在**的标题。
# 这与之前修掉的 frontmatter 假阳性是同一类问题：把合规产物判成违规的检查，
# 只会教人忽略它的输出。豁免是**显式枚举**的，新增豁免必须写进本表并说明理由。
G4_TEMPLATE_HEADINGS="Overview|When to Use|Workflow|Usage & Script|Input Contract|Output Contract|Success Contract|Boundaries & Constraints|Strict Rules|用途|使用方式|输入字段|输出字段|退出码|上下游|边界|目录结构"

# ── G4 重复标题的**模板化文档**豁免（PKG-009）──────────────────────────────────
# 「跨文件重复标题」这个指标的语义是「同一段话被复制到多处」。但有两类文档的章节骨架是
# **被契约强制要求重复**的，它们重复标题不代表冗余：
#   1) skill-pool/skills/**  技能契约：enforce-contract-completeness 强制每份 SKILL.md/README.md
#      使用同一组章节（Overview / When to Use / Workflow / Success Contract …）；
#   2) skill-pool/docs/requirements/execution/**  执行包明细：pkg-002~pkg-009 共用同一套
#      章节模板（范围 / 前置条件 / 有序任务清单 / 自决假设留痕 …）。
# 对这两类文档，真正的冗余信号是**块级相似度**（G4_DUP_PAIRS，阈值 0），而不是标题是否同名。
# 把它们排除后，标题指标重新只对散文型文档生效。
G4_HEADING_EXCLUDE_GLOBS="skill-pool/skills/*/*.md skill-pool/docs/requirements/execution/*.md"

# ── G4 单行重复的**骨架行**豁免（PKG-009）──────────────────────────────────────
# 「单行最高重复次数」的语义是「同一行内容被抄了 N 遍」。但下列行是**契约要求每份文档都写**的骨架：
#   * `flowchart TD`        —— standardize-workflow-sop 强制每份 SKILL.md 带 Mermaid SOP
#   * `composition:`        —— YAML Frontmatter 的固定键
#   * 标准输出框架的状态行 / 版本块标题 —— format-status-block 与版本治理规范强制
# 实测：不豁免时该指标被 `flowchart TD` 顶到 120（限 65），而它一个字节的内容语义都没有。
# 与表格分隔行是同一类**结构性假阳性**：文档越多越必然误报。
# 豁免后仍超限，才是真的有人把同一行抄了很多遍。
G4_TEMPLATE_LINES="flowchart TD|flowchart LR|composition:|graph TD|sequenceDiagram"

# ── 散落垃圾扫描的排除区（空格分隔多个 glob）────────────────────────────────────
# ai-control/reports/bundle_backups/ 是管控机制自己的**备份产物区**，
# 那些 .bak 是备份动作的预期结果，不是散落垃圾。把工具自己的产物算成垃圾，
# 会让 G2 永久红灯，从而掩盖真正的垃圾文件。
#
# 2026-09-29 新增 `*/.DS_Store`（REQ 留痕见 docs/requirements.md 附录"资产变更留痕"）：
# .DS_Store 是 macOS Finder 的目录元数据，**删除后由系统在 10~20 秒内自动回填**（本轮实测）。
# 不豁免的后果不是"检查变松"，而是"检查变成噪声"：G2 在 4/4 与 3/4 之间来回闪烁，
# 审计脚本每次跑都随机扣 16 分，真正的垃圾文件反而淹没在这种抖动里。
# 同一理由已在 .gitignore 中成立（.DS_Store 从不入库），此处只是让判定与入库口径一致。
G2_STRAY_EXCLUDE="*/bundle_backups/* */.DS_Store"
# 跨文件同名二级标题上限。索引类文档刻意复用标题，故留有余量。
G4_HEADING_LIMIT=12
# 单行最高重复次数上限。模板词汇会推高此项，仅作异常放大信号。
# 随受管文档数增长（当前 73 份受管文档，头部引用版本治理规范行达 51 次），调谐至 65
G4_TOP_DUP_LIMIT=65

# ── 运行时 ───────────────────────────────────────────────────────────────────
# status.json 缓存有效期（秒）。看板在此窗口内秒回，不重复扫描。
DSH_CONTROL_TTL=30
# Node 运行时路径（留空则自动探测：DSH 自带 → PATH → 常见安装位置）
DSH_NODE_BIN=""

# ── 底层物理锁 Agent (Physical Lock Agent) ─────────────────────────────────────
# 是否强制启用工序链式底层物理锁（必须完成上一步方可执行下一步，全域生效）
PHYSICAL_LOCK_ENFORCE=true

# ── OUT_* 输出结构契约阈值（REQ-090 / R1~R5）──────────────────────────────────
# 唯一权威源：rules/system/output_standard.md §六。判定器：scripts/output_audit.mjs。
# 为什么外置：数字写死在脚本里，规范与判定就会各说各话；外置后改阈值不动代码。
# 允许的首行状态图标（空格分隔，四态，含义见输出结构契约 §二①）
OUT_BANNER_ICONS="🟡 🟢 🔵 🔴"
# 一句话总结的标签文字
OUT_SUMMARY_LABEL="一句话总结"
# 一句话总结必须出现在正文前几个非空行内（首屏范围）
OUT_SUMMARY_SCAN_LINES=6
# 一句话总结的汉字数区间（数字、字母、标点不计入）
OUT_SUMMARY_MIN_CHARS=4
OUT_SUMMARY_MAX_CHARS=30
# 正文汉字数短于此值，豁免"一句话总结"（首行徽标已承载结论）
OUT_SUMMARY_EXEMPT_BODY_CHARS=40
# 最大标题嵌套级数与最大列表缩进层数（与可读性法典"嵌套 ≤3 级"同源）
OUT_MAX_HEADING_DEPTH=3
OUT_MAX_LIST_DEPTH=3
# 专业档标记（出现即判为专业档；不出现一律按浅白档判）
OUT_PRO_ICON="⚙️ 专业档"
# 进度回执四项固定标头（REQ-090 / R2），缺一即判红
OUT_RECEIPT_FIELDS="🔧 本轮做了什么|🧪 判定证据|📊 完成度|🚧 还差什么"

# ── LANG_* 文字可读性阈值（REQ-090 / R4）──────────────────────────────────────
# 字表出处：data/common_chars.txt（GB2312 一级汉字 3755 字，生成器 scripts/gen_common_chars.mjs）
# 生僻字判定上限。0 = 一个都不许有（硬判据，外部字表支撑，非自造阈值）
LANG_RARE_CHAR_MAX=0
# 黑话词表（仅报告项，不作硬门：哪些词算黑话没有外部权威边界）
LANG_JARGON_BLACKLIST="赋能 抓手 闭环 颗粒度 拉通 打法 心智 组合拳 顶层设计"
# 超长句阈值（汉字数，无标点即算同一句）；仅报告项
LANG_LONG_SENTENCE_CHARS=60
