# ==============================================================================
# AI 执行流程管控 · 门禁阈值配置 (Gate Thresholds)
# ==============================================================================
# 这是你唯一需要手改的调参文件。改完立即生效，无需重启任何东西。
# 语义：门禁是"累积"的 —— 必须按 G1→G2→G3→G4 顺序全部通过，才算可执行。
# ==============================================================================

# ── G1 项目初始化 ────────────────────────────────────────────────────────────
# 判定时跳过的一级目录（不作为"需要有主"的检查对象）
G1_SKIP_DIRS=".git .dsh_locks ai-control"

# ── G2 工程结构化 ────────────────────────────────────────────────────────────
# 允许的散落垃圾文件数（.DS_Store / *.tmp / ~$* / *.swp / *.bak）
G2_ORPHAN_MAX=0
# 允许的无标题 Markdown 文件数（空文件豁免）
G2_UNTITLED_MAX=2

# ── G3 需求文档同步 ──────────────────────────────────────────────────────────
# 台账文件（相对项目根）
G3_LEDGER="docs/requirements.md"
# 允许的最大未提交变更数。超过即判定"文档未同步入库"。
# 建议：日常开发设 30；发布前收紧到 0。
G3_DIRTY_LIMIT=30

# ── G4 冗余检测 ──────────────────────────────────────────────────────────────
# 扫描范围（相对项目根的一级目录）
G4_SCAN_DIRS="rules knowledge indexes docs templates memory"
# 排除表：按内容性质排除"模板型台账"。需求台账 40+ 条共用同一字段模板，
# 天然产生大量重复字段名，属于设计意图而非冗余，因此排除。
G4_EXCLUDE_GLOBS="docs/requirements.md"
# 高相似块对上限。判定由 scripts/redundancy_scan.mjs 完成：
#   块级切分 → 归一化（抹掉版本/日期/数字/文件名）→ 词级 Jaccard ≥ 0.85
# 该检测器内置元数据块过滤，能区分"模板结构"与"真复制粘贴"。
# 实测校准：修好假阳性后本仓库为 0。若你确实引入重复内容，此处会上升。
G4_DUP_PAIRS=0
# 跨文件同名二级标题上限。索引类文档刻意复用标题，故留有余量。
G4_HEADING_LIMIT=12
# 单行最高重复次数上限。模板词汇会推高此项，仅作异常放大信号。
G4_TOP_DUP_LIMIT=45

# ── 运行时 ───────────────────────────────────────────────────────────────────
# status.json 缓存有效期（秒）。看板在此窗口内秒回，不重复扫描。
DSH_CONTROL_TTL=30
# Node 运行时路径（留空则自动探测：DSH 自带 → PATH → 常见安装位置）
DSH_NODE_BIN=""
