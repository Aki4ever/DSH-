# ==============================================================================
# 管控耗时预算配置 (Performance Budget) — REQ-102 / EFF-NOFLOW
# ------------------------------------------------------------------------------
# 唯一调参入口：改完即时生效，无需重启任何东西。
#
# 纪律（写进配置本身，防止"把预算改大来变绿"）：
#   调大 GATE_TOTAL_BUDGET_MS 必须在同一次提交里写明理由（哪一项判定变重了、
#   为什么这次变重是必要的）。没有理由的调大一律视为"用调参掩盖退化"。
# ==============================================================================

# 一次 `./scripts/control_gates.sh check` 的墙钟预算（毫秒）。
# 基线：2026-10-10 实测 32.2s（其中 scope_audit 17.0s）。
# 目标：优化后 <= 25s；预算先按 45s 兜底，避免优化未落地时门禁因耗时误判。
GATE_TOTAL_BUDGET_MS=45000

# 优化目标（供 control_profiler --check 之外的对照使用，不参与判定）
GATE_TOTAL_TARGET_MS=25000

# 单项判定耗时上限（毫秒）：任一项超过此值即视为"热点"，须给出降耗方案。
ITEM_HOTSPOT_MS=10000
