# 管控机制篇幅与 token 预算（REQ-093 / R4）
#
# 受管对象界定：**管控机制本体**（每次会话被注入、或做判定必读的那些文本），
# 不含历史需求台账 docs/ 与图片资产 assets/ —— 那两者是"档案"，不是"每轮成本"。
#
# 硬判据（--check 恒判）：能力等价（证据串全存活）+ 篇幅只许减不许涨
# 目标项（--check --enforce-target 才判）：总降幅是否达标
# 判定入口：node scripts/token_budget_audit.mjs --check

TOKEN_SCOPE="AGENTS.md rules/system/meta_rules.md rules/system/output_standard.md rules/system/language_standard.md indexes/rules_index.md indexes/shortcuts_index.md indexes/navigation_router.md ai-control/README.md"

# 目标降幅（REQ-093 诉求 4：「压缩管控机制的篇幅，让管控机制精简有效」）
TOKEN_TARGET_RATIO=0.30

# 篇幅增长容差：单文件超出基线这个比例即判"膨胀"，须书面豁免
TOKEN_GROWTH_TOLERANCE=0.05

# 基线产物（--measure 写入，--check 读取）
TOKEN_BASELINE_FILE="ai-control/reports/state/token_budget.json"

# 等价能力证据串清单（压缩后这些字符串必须全部存活）
TOKEN_CASES_FILE="ai-control/config/token_budget_cases.json"

# 实测无损下限（2026-10-02 第二轮取证）：各受管文件在"不删事实/不删命令/不删编号/不破坏版式"
# 前提下能压到的合计比例。逐文件下限合计 ≈ 0.76（即约 26 000 tokens）。
# 为什么必须登记：TOKEN_TARGET_RATIO 是**进取目标**，下限是**物理边界**；两者混为一谈，
# 就会出现"为了达标去删规则正文"的坏激励。目标未达时必须如实报告差值，不得折算通过。
TOKEN_LOSSLESS_FLOOR_RATIO=0.748
