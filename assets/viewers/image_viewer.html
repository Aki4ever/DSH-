<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>图片缩放查看器 · Image Zoom Viewer</title>
<!--
  图片缩放查看器 · 单文件 / 零外部依赖
  关键设计说明（中文注释版）
  1) 滚轮缩放为什么以“光标位置”为锚点？
     若以视口中心为锚点，光标停在某个细节上滚动时，该细节会随缩放向中心/边缘漂移，
     用户需要不断补一次平移才能找回目标，放大高倍率时体验会迅速恶化。
     这里的做法是：先把光标位置换算成“图片像素坐标 (px,py)”，缩放后再反解出新的
     scrollLeft/scrollTop，让同一个图片像素始终停在光标的同一屏幕位置 —— 所见即所缩。
  2) 为什么档位到顶/到底必须把按钮置灰禁用？
     静默无反应会让用户误判为“页面卡死/按钮坏了”。显式禁用（disabled + aria-disabled
     语义 + 降低不透明度 + not-allowed 光标）把“已到极限”这一事实可见化，
     同时避免产生“点了但没变化”的无效操作记录。
  3) 居中策略：不依赖 flex 居中（大图在部分浏览器会被裁掉不可滚动），
     改为 JS 计算 padding，使图片小于视口时天然居中、大于视口时为 0 且可完整滚动。
     注意 padding 按 CSS 简写顺序记为 [top,right,bottom,left]，且逐轴独立判断；
     若对超出视口的轴也加 padding，会凭空撑出多余滚动空间、导致滚不到图片真实边缘。
  4) 已知边界（如实记录，非缺陷）：当图片整体小于视口（无滚动条）时，
     scrollLeft/scrollTop 恒为 0，没有任何可调节自由度，因此“光标锚点绝对不漂移”
     在该状态下在数学上不可实现 —— 此时缩放表现为按比例重新居中。
     一旦图片大于视口进入可滚动区间，锚点即严格成立（实测漂移 < 1e-9 相对量）。
-->
<style>
  :root{
    --bg:#070B12;          /* 页面背景 */
    --card:#0F1A24;        /* 卡片/工具条底色 */
    --border:#233046;      /* 边框 */
    --fg:#EAF2FA;          /* 主文字 */
    --muted:#8A98AC;       /* 次要文字 */
    --accent:#00D2FF;      /* 强调色 1 */
    --accent2:#2EC4B6;     /* 强调色 2 */
    --disabled:#3A4759;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:var(--bg);color:var(--fg);
    font-family:"PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,"Noto Sans CJK SC",sans-serif;
    display:flex;flex-direction:column;overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }

  /* ---------- 顶部标题区 ---------- */
  header{
    flex:0 0 auto;padding:12px 18px 10px;background:var(--card);
    border-bottom:1px solid var(--border);
    display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;
  }
  .title-wrap{min-width:0}
  h1{
    margin:0;font-size:16px;font-weight:650;letter-spacing:.4px;
    display:flex;align-items:center;gap:9px;
  }
  h1 .dot{
    width:9px;height:9px;border-radius:50%;flex:0 0 auto;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    box-shadow:0 0 10px rgba(0,210,255,.75);
  }
  .hint{margin:4px 0 0 18px;font-size:11.5px;color:var(--muted);line-height:1.5}
  .hint kbd{
    background:#101C28;border:1px solid var(--border);border-bottom-width:2px;
    border-radius:4px;padding:0 5px;font:inherit;font-size:11px;color:var(--fg);
  }

  /* ---------- 工具条 ---------- */
  .toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  button{
    font:inherit;font-size:13px;color:var(--fg);
    background:#101C28;border:1px solid var(--border);border-radius:8px;
    padding:7px 12px;min-width:40px;height:34px;cursor:pointer;
    display:inline-flex;align-items:center;justify-content:center;gap:6px;
    transition:background .14s ease,border-color .14s ease,transform .05s ease,box-shadow .14s ease,color .14s ease;
    user-select:none;
  }
  button:hover:not(:disabled){background:#16273A;border-color:var(--accent);color:#fff}
  button:active:not(:disabled){transform:translateY(2px)}   /* 按下下沉 1~2px */
  button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  button:disabled{
    opacity:.42;cursor:not-allowed;color:var(--muted);
    border-color:var(--disabled);background:#0B141D;
  }
  button.primary{border-color:var(--accent2);color:#EAF2FA}
  button.primary:hover:not(:disabled){border-color:var(--accent);box-shadow:0 0 0 1px rgba(0,210,255,.25) inset}
  .zoom-readout{
    min-width:78px;height:34px;padding:0 12px;border-radius:8px;
    background:#0B141D;border:1px solid var(--border);
    display:inline-flex;align-items:center;justify-content:center;
    font-variant-numeric:tabular-nums;font-size:14px;font-weight:600;
    color:var(--accent);letter-spacing:.5px;
  }
  .sep{width:1px;height:22px;background:var(--border);margin:0 2px}
  .status{font-size:11.5px;color:var(--muted);max-width:38ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  /* ---------- 图片视口 ---------- */
  #viewport{
    flex:1 1 auto;position:relative;overflow:auto;background:var(--bg);
    background-image:
      linear-gradient(rgba(35,48,70,.35) 1px,transparent 1px),
      linear-gradient(90deg,rgba(35,48,70,.35) 1px,transparent 1px);
    background-size:28px 28px,28px 28px;
    cursor:grab;overscroll-behavior:contain;scrollbar-color:var(--border) transparent;
  }
  #viewport.panning{cursor:grabbing}
  #stage{
    display:inline-block;padding:0;line-height:0;   /* padding 由 JS 计算，用于“小于视口时居中” */
  }
  #img{
    display:block;max-width:none;max-height:none;
    -webkit-user-drag:none;user-select:none;
    box-shadow:0 0 0 1px var(--border),0 18px 48px rgba(0,0,0,.6);
    background:#0B141D;
  }
  #img.pixelated{image-rendering:pixelated;image-rendering:crisp-edges}

  /* ---------- 无 src 时的本地选择区 ---------- */
  #dropzone{
    position:absolute;inset:0;margin:auto;
    width:min(560px,86%);height:min(300px,70%);
    border:2px dashed var(--border);border-radius:14px;background:rgba(15,26,36,.94);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
    color:var(--muted);text-align:center;cursor:pointer;padding:22px;
    transition:border-color .16s ease,background .16s ease,transform .16s ease;
  }
  #dropzone:hover{border-color:var(--accent);background:rgba(16,28,40,.96)}
  #dropzone:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
  #dropzone.dragover{border-color:var(--accent2);background:rgba(46,196,182,.10);transform:scale(1.01)}
  /* 图标用纯 CSS 绘制，不依赖任何 emoji/字体资源（避免离线或字体缺失时显示为方框） */
  #dropzone .dz-ico{
    width:52px;height:40px;border:2px solid var(--accent);border-radius:6px;
    position:relative;box-shadow:0 0 16px rgba(0,210,255,.28);
  }
  #dropzone .dz-ico::before{
    content:"";position:absolute;left:7px;top:7px;width:9px;height:9px;border-radius:50%;
    background:var(--accent2);
  }
  #dropzone .dz-ico::after{
    content:"";position:absolute;left:2px;bottom:2px;right:2px;height:16px;
    background:linear-gradient(135deg,transparent 46%,var(--accent) 47%,var(--accent) 53%,transparent 54%);
  }
  #dropzone .dz-main{color:var(--fg);font-size:15px;font-weight:600}
  #dropzone .dz-sub{font-size:12px;line-height:1.7}
  #dropzone .dz-sub code{
    background:#0B141D;border:1px solid var(--border);border-radius:4px;padding:1px 5px;
    color:var(--accent);font-size:11.5px;
  }
  .hidden{display:none !important}

  /* ---------- 错误提示 ---------- */
  #error{
    position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    max-width:min(620px,88%);padding:18px 22px;border-radius:12px;
    background:var(--card);border:1px solid #7A2E3A;color:var(--fg);
    font-size:13px;line-height:1.7;box-shadow:0 18px 48px rgba(0,0,0,.6);z-index:5;
  }
  #error b{color:#FF7B8A}
  #error .epath{
    display:block;margin-top:8px;padding:8px 10px;border-radius:8px;
    background:#0B141D;border:1px solid var(--border);color:var(--muted);
    font-size:11.5px;word-break:break-all;
  }
</style>
</head>
<body>

<header>
  <div class="title-wrap">
    <h1><span class="dot" aria-hidden="true"></span>图片缩放查看器 · Image Zoom Viewer</h1>
    <p class="hint">
      快捷键：<kbd>+</kbd>/<kbd>=</kbd> 放大 · <kbd>-</kbd> 缩小 · <kbd>0</kbd> 复位 100% ·
      <kbd>滚轮</kbd> 以光标为中心缩放 · <kbd>拖拽</kbd> 平移 · <kbd>Esc</kbd> 关闭弹层 ·
      档位 25%–800%
    </p>
  </div>

  <div class="toolbar">
    <button id="btnOut" type="button" aria-label="缩小一档" title="缩小一档（快捷键 -）">−</button>
    <span class="zoom-readout" id="readout" role="status" aria-live="polite" aria-label="当前缩放比例">100%</span>
    <button id="btnIn" type="button" aria-label="放大一档" title="放大一档（快捷键 +）">+</button>
    <span class="sep" aria-hidden="true"></span>
    <button id="btnReset" type="button" class="primary" aria-label="重置为 100% 并居中" title="重置 1:1（快捷键 0）">1:1</button>
    <button id="btnFit" type="button" aria-label="适应窗口显示" title="适应窗口">适应</button>
    <button id="btnFile" type="button" aria-label="打开本地图片文件" title="打开本地图片">打开图片</button>
    <span class="sep" aria-hidden="true"></span>
    <span class="status" id="status" title="">未加载图片</span>
  </div>
</header>

<div id="viewport" tabindex="-1" aria-label="图片画布，可滚轮缩放、拖拽平移">
  <div id="stage"><img id="img" class="hidden" alt="待查看的图片"></div>

  <div id="dropzone" role="button" tabindex="0"
       aria-label="拖拽图片到此，或按回车/空格选择本地图片文件">
    <div class="dz-ico" aria-hidden="true"></div>
    <div class="dz-main">拖拽图片到此处，或点击选择本地文件</div>
    <div class="dz-sub">
      支持 PNG / JPG / GIF / WebP / SVG / BMP<br>
      也可用 URL 参数直接指定图片：<code>?src=&lt;图片路径&gt;</code>
      （相对路径与绝对路径均可）
    </div>
  </div>

  <div id="error" class="hidden" role="alert"></div>
  <input id="fileInput" type="file" accept="image/*" class="hidden" aria-hidden="true" tabindex="-1">
</div>

<script>
(function(){
  'use strict';

  /* ============ 缩放档位（唯一权威定义） ============ */
  var ZOOM_STEPS = [0.25, 0.5, 0.75, 1, 1.5, 2, 3, 4, 6, 8];
  var DEFAULT_INDEX = 3;                    // 默认 100%

  /* ============ DOM 引用 ============ */
  var viewport = document.getElementById('viewport');
  var stage    = document.getElementById('stage');
  var img      = document.getElementById('img');
  var readout  = document.getElementById('readout');
  var statusEl = document.getElementById('status');
  var dropzone = document.getElementById('dropzone');
  var errorBox = document.getElementById('error');
  var fileInput= document.getElementById('fileInput');
  var btnIn    = document.getElementById('btnIn');
  var btnOut   = document.getElementById('btnOut');
  var btnReset = document.getElementById('btnReset');
  var btnFit   = document.getElementById('btnFit');
  var btnFile  = document.getElementById('btnFile');

  /* ============ 状态 ============ */
  var state = {
    scale: ZOOM_STEPS[DEFAULT_INDEX],
    index: DEFAULT_INDEX,
    natW: 0,
    natH: 0,
    loaded: false,
    objectUrl: null
  };

  function clamp(v, lo, hi){ return Math.min(hi, Math.max(lo, v)); }

  /* ============ 尺寸与居中 ============
     图片比视口小时，把差值的一半做成 padding 实现居中；
     比视口大时 padding 归零，保证滚动条能滚到完整图片（不会像 flex 居中那样被裁掉）。 */
  function applyLayout(){
    if (!state.loaded) return;
    var w = Math.max(1, Math.round(state.natW * state.scale));
    var h = Math.max(1, Math.round(state.natH * state.scale));
    img.style.width  = w + 'px';
    img.style.height = h + 'px';

    var cw = viewport.clientWidth;
    var ch = viewport.clientHeight;
    // 逐轴独立判断：该轴比视口小 → 用左右/上下 padding 居中（滚动量为 0）；
    // 该轴比视口大 → padding 必须为 0，否则会凭空撑出多余的滚动空间、滚不到图片边缘。
    var pl = 0, pr = 0, pt = 0, pb = 0;
    if (w < cw){ pl = Math.floor((cw - w) / 2); pr = cw - w - pl; }
    if (h < ch){ pt = Math.floor((ch - h) / 2); pb = ch - h - pt; }
    stage.style.padding = pt + 'px ' + pr + 'px ' + pb + 'px ' + pl + 'px';

    // 高倍率放大时用像素化渲染，便于核对细节像素
    img.classList.toggle('pixelated', state.scale > 1);
  }

  function maxScrollX(){ return Math.max(0, viewport.scrollWidth  - viewport.clientWidth); }
  function maxScrollY(){ return Math.max(0, viewport.scrollHeight - viewport.clientHeight); }

  /* ============ 缩放核心 ============
     anchor 为 null 表示以视口中心为锚点（按钮/键盘缩放）；
     传入视口坐标系下的 {x,y} 时以该点为锚点（滚轮缩放）。 */
  function setScale(newScale, anchor){
    if (!state.loaded) return;
    newScale = clamp(newScale, ZOOM_STEPS[0], ZOOM_STEPS[ZOOM_STEPS.length - 1]);
    if (Math.abs(newScale - state.scale) < 1e-6){ syncControls(); return; }

    var oldW = Math.max(1, Math.round(state.natW * state.scale));
    var oldH = Math.max(1, Math.round(state.natH * state.scale));
    var vw = viewport.clientWidth, vh = viewport.clientHeight;

    var ax, ay;
    if (anchor){
      ax = clamp(anchor.x, 0, vw);
      ay = clamp(anchor.y, 0, vh);
    } else {
      ax = vw / 2;
      ay = vh / 2;
    }

    // 1) 反解锚点对应的“图片像素坐标”（锚点可能落在留白处，故先收进图片范围）
    var contentX = clamp(viewport.scrollLeft + ax, 0, oldW);
    var contentY = clamp(viewport.scrollTop  + ay, 0, oldH);
    var relX = contentX / oldW;
    var relY = contentY / oldH;

    // 2) 应用新倍率并重算布局（padding 会随尺寸变化）
    state.scale = newScale;
    applyLayout();

    // 3) 正解新的滚动位置，让同一图片像素回到锚点屏幕上
    var newW = Math.max(1, Math.round(state.natW * newScale));
    var newH = Math.max(1, Math.round(state.natH * newScale));
    viewport.scrollLeft = relX * newW - ax;
    viewport.scrollTop  = relY * newH - ay;

    syncControls();
  }

  /* 跳到最近档位：滚轮用小步长累积，避免一次滚动跨太多档 */
  function zoomByStep(delta, anchor){
    var target = state.scale * Math.pow(1.15, delta);
    target = clamp(target, ZOOM_STEPS[0], ZOOM_STEPS[ZOOM_STEPS.length - 1]);
    // 吸附到档位区间内，保持“多级档位”语义一致
    var lo = ZOOM_STEPS[0], hi = ZOOM_STEPS[ZOOM_STEPS.length - 1];
    for (var i = 0; i < ZOOM_STEPS.length - 1; i++){
      if (target >= ZOOM_STEPS[i] && target <= ZOOM_STEPS[i + 1]){
        lo = ZOOM_STEPS[i]; hi = ZOOM_STEPS[i + 1]; break;
      }
    }
    // 连续滚轮时保留档位之间的中间值手感，但限制在相邻档位区间内
    setScale(clamp(target, lo, hi), anchor || null);
  }

  function stepIndex(dir){
    if (!state.loaded) return;
    var i = state.index + dir;
    if (i < 0 || i >= ZOOM_STEPS.length) { syncControls(); return; }
    state.index = i;
    setScale(ZOOM_STEPS[i], null);
  }

  /* ============ 控件状态同步 ============ */
  function syncControls(){
    var pct = Math.round(state.scale * 100);
    readout.textContent = pct + '%';

    var atMin = !state.loaded || state.scale <= ZOOM_STEPS[0] + 1e-9;
    var atMax = !state.loaded || state.scale >= ZOOM_STEPS[ZOOM_STEPS.length - 1] - 1e-9;

    // 到顶/到底置灰禁用：把“已到极限”显式化，而不是静默无反应
    btnOut.disabled = atMin;
    btnIn.disabled  = atMax;
    btnOut.setAttribute('aria-disabled', String(atMin));
    btnIn.setAttribute('aria-disabled', String(atMax));
    btnOut.title = atMin ? '已是最小档位 25%' : '缩小一档（快捷键 -）';
    btnIn.title  = atMax ? '已是最大档位 800%' : '放大一档（快捷键 +）';

    btnReset.disabled = !state.loaded;
    btnFit.disabled   = !state.loaded;
    btnReset.setAttribute('aria-disabled', String(!state.loaded));
    btnFit.setAttribute('aria-disabled', String(!state.loaded));

    // 让“当前档位”与自由缩放后的实际倍率保持一致
    var nearest = 0, best = Infinity;
    for (var i = 0; i < ZOOM_STEPS.length; i++){
      var d = Math.abs(ZOOM_STEPS[i] - state.scale);
      if (d < best){ best = d; nearest = i; }
    }
    state.index = nearest;
  }

  /* ============ 复位 / 适应窗口 ============ */
  function resetView(){
    if (!state.loaded) return;
    state.index = DEFAULT_INDEX;
    state.scale = ZOOM_STEPS[DEFAULT_INDEX];
    applyLayout();
    viewport.scrollLeft = (viewport.scrollWidth  - viewport.clientWidth)  / 2;
    viewport.scrollTop  = (viewport.scrollHeight - viewport.clientHeight) / 2;
    syncControls();
  }

  function fitView(){
    if (!state.loaded) return;
    var s = Math.min(
      Math.max(1, viewport.clientWidth)  / state.natW,
      Math.max(1, viewport.clientHeight) / state.natH
    );
    // 不放大超过 100%，仅把大图缩到可见范围
    s = clamp(Math.min(s, 1), ZOOM_STEPS[0], 1);
    state.scale = s;
    applyLayout();
    viewport.scrollLeft = 0;
    viewport.scrollTop  = 0;
    syncControls();
  }

  /* ============ 载入图片 ============ */
  function showError(msg, detail){
    errorBox.innerHTML = '<b>图片加载失败</b><br>' + msg +
      (detail ? '<span class="epath">' + detail + '</span>' : '');
    errorBox.classList.remove('hidden');
  }
  function clearError(){ errorBox.classList.add('hidden'); errorBox.innerHTML = ''; }

  function onImageReady(src, label){
    state.loaded = true;
    state.natW = img.naturalWidth  || 1;
    state.natH = img.naturalHeight || 1;
    img.classList.remove('hidden');
    dropzone.classList.add('hidden');
    clearError();

    state.index = DEFAULT_INDEX;
    state.scale = ZOOM_STEPS[DEFAULT_INDEX];
    applyLayout();
    viewport.scrollLeft = (viewport.scrollWidth  - viewport.clientWidth)  / 2;
    viewport.scrollTop  = (viewport.scrollHeight - viewport.clientHeight) / 2;
    syncControls();

    statusEl.textContent = state.natW + '×' + state.natH + ' · ' + label;
    statusEl.title = src;
  }

  function loadFromUrl(url, label){
    if (state.objectUrl){ URL.revokeObjectURL(state.objectUrl); state.objectUrl = null; }
    img.removeAttribute('src');
    img.onload = function(){ onImageReady(url, label || 'URL'); };
    img.onerror = function(){
      state.loaded = false;
      img.classList.add('hidden');
      dropzone.classList.remove('hidden');
      syncControls();
      showError('无法读取该地址，请确认路径正确、文件存在且可访问。', url);
      statusEl.textContent = '加载失败';
    };
    img.src = url;
  }

  function loadFromFile(file){
    if (!file) return;
    if (!/^image\//.test(file.type || '')){
      showError('所选文件不是图片类型。', file.name);
      return;
    }
    if (state.objectUrl) URL.revokeObjectURL(state.objectUrl);
    // 本地文件用 objectURL，绕开浏览器对 file:// 的同源限制，且不产生网络请求
    state.objectUrl = URL.createObjectURL(file);
    loadFromUrl(state.objectUrl, file.name + ' · ' + (file.size / 1024).toFixed(1) + ' KB');
  }

  /* ============ URL 参数 ?src= ============ */
  function resolveSrcParam(){
    var raw = null;
    try {
      // 手动解析，兼容 file:// 下 location.search 行为差异
      var q = location.search.replace(/^\?/, '');
      q.split('&').forEach(function(pair){
        if (!pair) return;
        var i = pair.indexOf('=');
        var k = i < 0 ? pair : pair.slice(0, i);
        var v = i < 0 ? '' : pair.slice(i + 1);
        if (decodeURIComponent(k) === 'src' && raw === null){
          raw = decodeURIComponent(v.replace(/\+/g, ' '));
        }
      });
    } catch (e) { raw = null; }
    return raw;
  }

  function boot(){
    var src = resolveSrcParam();
    if (src){
      // 相对路径按当前文档解析，绝对路径/协议地址原样使用
      var isAbsolute = /^([a-zA-Z][a-zA-Z0-9+.-]*:|\/\/|\/)/.test(src) || src.indexOf('file:') === 0;
      var url = src;
      if (!/^[a-zA-Z][a-zA-Z0-9+.-]*:/.test(src)){
        try { url = new URL(src, location.href).href; } catch (e) { url = src; }
      }
      loadFromUrl(url, isAbsolute ? '绝对路径' : '相对路径');
    } else {
      syncControls();
    }
  }

  /* ============ 事件：按钮 ============ */
  btnIn.addEventListener('click', function(){ stepIndex(1); });
  btnOut.addEventListener('click', function(){ stepIndex(-1); });
  btnReset.addEventListener('click', resetView);
  btnFit.addEventListener('click', fitView);
  btnFile.addEventListener('click', function(){ fileInput.click(); });
  fileInput.addEventListener('change', function(){
    if (fileInput.files && fileInput.files[0]) loadFromFile(fileInput.files[0]);
    fileInput.value = '';
  });

  /* ============ 事件：滚轮缩放（光标锚点） ============ */
  viewport.addEventListener('wheel', function(ev){
    if (!state.loaded) return;
    ev.preventDefault();                          // 阻止页面/父容器滚动
    var rect = viewport.getBoundingClientRect();
    var anchor = { x: ev.clientX - rect.left, y: ev.clientY - rect.top };
    var delta = ev.deltaY;
    if (ev.deltaMode === 1) delta *= 16;          // 行模式换算
    else if (ev.deltaMode === 2) delta *= viewport.clientHeight;
    // 向上滚 = 放大；指数式步进，保证跨倍率区间手感一致
    var factor = Math.pow(1.0018, -delta);
    zoomByStep(Math.log(factor) / Math.log(1.15), anchor);
  }, { passive: false });

  /* ============ 事件：拖拽平移 ============ */
  var drag = null;
  viewport.addEventListener('mousedown', function(ev){
    if (!state.loaded || ev.button !== 0) return;
    if (ev.target.closest && ev.target.closest('button, #dropzone')) return;
    drag = { x: ev.clientX, y: ev.clientY, sl: viewport.scrollLeft, st: viewport.scrollTop };
    viewport.classList.add('panning');
    ev.preventDefault();
  });
  window.addEventListener('mousemove', function(ev){
    if (!drag) return;
    viewport.scrollLeft = drag.sl - (ev.clientX - drag.x);
    viewport.scrollTop  = drag.st - (ev.clientY - drag.y);
  });
  window.addEventListener('mouseup', function(){
    if (!drag) return;
    drag = null;
    viewport.classList.remove('panning');
  });

  /* ============ 事件：触屏拖拽/双指缩放（渐进增强） ============ */
  var touch = null;
  viewport.addEventListener('touchstart', function(ev){
    if (!state.loaded) return;
    if (ev.touches.length === 1){
      touch = { mode:'pan', x:ev.touches[0].clientX, y:ev.touches[0].clientY,
                sl:viewport.scrollLeft, st:viewport.scrollTop };
    } else if (ev.touches.length === 2){
      var dx = ev.touches[0].clientX - ev.touches[1].clientX;
      var dy = ev.touches[0].clientY - ev.touches[1].clientY;
      touch = { mode:'pinch', dist: Math.sqrt(dx*dx + dy*dy), scale: state.scale };
    }
  }, { passive: true });
  viewport.addEventListener('touchmove', function(ev){
    if (!touch) return;
    if (touch.mode === 'pan' && ev.touches.length === 1){
      viewport.scrollLeft = touch.sl - (ev.touches[0].clientX - touch.x);
      viewport.scrollTop  = touch.st - (ev.touches[0].clientY - touch.y);
      ev.preventDefault();
    } else if (touch.mode === 'pinch' && ev.touches.length === 2){
      var dx = ev.touches[0].clientX - ev.touches[1].clientX;
      var dy = ev.touches[0].clientY - ev.touches[1].clientY;
      var d = Math.sqrt(dx*dx + dy*dy);
      var rect = viewport.getBoundingClientRect();
      var cx = (ev.touches[0].clientX + ev.touches[1].clientX) / 2 - rect.left;
      var cy = (ev.touches[0].clientY + ev.touches[1].clientY) / 2 - rect.top;
      setScale(clamp(touch.scale * (d / touch.dist), ZOOM_STEPS[0], ZOOM_STEPS[ZOOM_STEPS.length - 1]),
               { x:cx, y:cy });
      ev.preventDefault();
    }
  }, { passive: false });
  viewport.addEventListener('touchend', function(ev){
    if (ev.touches.length === 0) touch = null;
  }, { passive: true });

  /* ============ 事件：键盘 ============ */
  document.addEventListener('keydown', function(ev){
    if (ev.ctrlKey || ev.metaKey || ev.altKey) return;
    var t = ev.target;
    // 焦点在按钮上时，回车/空格交给按钮自身处理
    if (t && t.tagName === 'BUTTON' && (ev.key === 'Enter' || ev.key === ' ')) return;
    if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA')) return;

    switch (ev.key){
      case '+': case '=': stepIndex(1);  ev.preventDefault(); break;
      case '-': case '_': stepIndex(-1); ev.preventDefault(); break;
      case '0': resetView();             ev.preventDefault(); break;
      case 'Escape': {
        // 弹层场景：宿主页面可用 closeImageViewer 回调，或直接把本页置为关闭态
        if (window.parent && window.parent !== window && typeof window.parent.hideImageViewer === 'function'){
          window.parent.hideImageViewer();
        }
        var closer = document.getElementById('viewerClose') ||
                     (window.__imageViewerClose || null);
        if (typeof closer === 'function') { closer(); }
        ev.preventDefault();
        break;
      }
    }
  });

  /* ============ 事件：文件选择区（点击 + 拖拽 + 键盘） ============ */
  dropzone.addEventListener('click', function(){ fileInput.click(); });
  dropzone.addEventListener('keydown', function(ev){
    if (ev.key === 'Enter' || ev.key === ' '){ fileInput.click(); ev.preventDefault(); }
  });
  ['dragenter','dragover'].forEach(function(type){
    dropzone.addEventListener(type, function(ev){
      ev.preventDefault(); ev.stopPropagation();
      dropzone.classList.add('dragover');
    });
  });
  ['dragleave','dragend'].forEach(function(type){
    dropzone.addEventListener(type, function(ev){
      ev.preventDefault(); ev.stopPropagation();
      dropzone.classList.remove('dragover');
    });
  });
  dropzone.addEventListener('drop', function(ev){
    ev.preventDefault(); ev.stopPropagation();
    dropzone.classList.remove('dragover');
    var f = ev.dataTransfer && ev.dataTransfer.files && ev.dataTransfer.files[0];
    if (f) loadFromFile(f);
  });
  // 阻止把图片拖到页面其它位置时浏览器直接打开文件
  ['dragover','drop'].forEach(function(type){
    window.addEventListener(type, function(ev){ ev.preventDefault(); });
  });
  // 禁止图片元素自身被原生拖拽（否则与平移拖拽冲突）
  img.addEventListener('dragstart', function(ev){ ev.preventDefault(); });

  /* ============ 视口尺寸变化 ============ */
  var rt = null;
  window.addEventListener('resize', function(){
    if (!state.loaded) return;
    if (rt) clearTimeout(rt);
    rt = setTimeout(function(){
      var relX = (viewport.scrollLeft + viewport.clientWidth  / 2) /
                 Math.max(1, Math.round(state.natW * state.scale));
      var relY = (viewport.scrollTop  + viewport.clientHeight / 2) /
                 Math.max(1, Math.round(state.natH * state.scale));
      applyLayout();
      viewport.scrollLeft = relX * Math.round(state.natW * state.scale) - viewport.clientWidth  / 2;
      viewport.scrollTop  = relY * Math.round(state.natH * state.scale) - viewport.clientHeight / 2;
    }, 80);
  });

  /* ============ 对外 API（便于宿主页面弹层调用） ============ */
  window.ImageZoomViewer = {
    steps: ZOOM_STEPS.slice(),
    zoomIn:  function(){ stepIndex(1); },
    zoomOut: function(){ stepIndex(-1); },
    reset:   resetView,
    fit:     fitView,
    openUrl: function(url){ loadFromUrl(url, '外部调用'); },
    openFile: loadFromFile,
    getScale: function(){ return state.scale; }
  };

  boot();
})();
</script>
</body>
</html>
