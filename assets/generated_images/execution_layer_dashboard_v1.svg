  <text x="80" y="846" font-size="12" fill="#9FB3CC">悬空依赖 0 条（dangling_dependencies 空）</text>
  <text x="80" y="870" font-size="12" fill="#9FB3CC">七大簇：契约合规 12 · 输出规约 9 · 冲突冗余 8 ·</text>
  <text x="80" y="890" font-size="12" fill="#9FB3CC">意图路由 6 · 需求透视 4 · 外部纳管 3 · 引入演进 1</text>

  <rect x="396" y="747" width="320" height="170" rx="10" fill="url(#cardbg)" stroke="#233046" stroke-width="1.5"/>
  <rect x="396" y="747" width="5" height="170" rx="2.5" fill="#2EC4B6"/>
  <text x="416" y="777" font-size="14" font-weight="700" fill="#EAF2FA">实例安全 instance-safety.json</text>
  <text x="416" y="800" font-size="12" fill="#9FB3CC">扫描 177 个实例 · 发现问题 0 条</text>
  <rect x="416" y="812" width="280" height="16" rx="8" fill="#3A1519"/>
  <rect x="416" y="812" width="248" height="16" rx="8" fill="#2EC4B6"/>
  <text x="416" y="850" font-size="12" fill="#2EC4B6">safe_multi 157</text>
  <text x="560" y="850" font-size="12" fill="#FFB900">single_only 12 · needs_lock 8</text>
  <text x="416" y="878" font-size="11.5" fill="#5F7189">可无锁并发占 88.7%；需独占锁的 8 条必须走</text>
  <text x="416" y="898" font-size="11.5" fill="#5F7189">全局调度锁，禁止并发脏写。</text>

  <rect x="732" y="747" width="328" height="170" rx="10" fill="url(#cardbg)" stroke="#233046" stroke-width="1.5"/>
  <rect x="732" y="747" width="5" height="170" rx="2.5" fill="#A17BFF"/>
  <text x="752" y="777" font-size="14" font-weight="700" fill="#EAF2FA">脚本与树规模</text>
  <text x="752" y="818" font-size="30" font-weight="700" fill="#A17BFF">103</text>
  <text x="818" y="818" font-size="13" fill="#9FB3CC">个技能内嵌脚本</text>
  <text x="752" y="846" font-size="12" fill="#9FB3CC">树条目 196 = skill 182 + cli 9 + agent 4 + plugin 1</text>
  <text x="752" y="870" font-size="12" fill="#9FB3CC">树形态：L4 → 集群 → L3 → 原子 四段式</text>
  <text x="752" y="894" font-size="11.5" fill="#5F7189">由 build-execution-tree 生成，禁止人工编辑。</text>

  <!-- ══ ④ 漂移与空洞 ══ -->
  <rect x="60" y="948" width="6" height="24" rx="3" fill="#F45B69"/>
  <text x="80" y="969" font-size="22" font-weight="700" fill="#EAF2FA">④ 漂移与空洞清单（盘点真正要盯的部分）</text>
  <text x="720" y="969" font-size="13" fill="#7C8CA3">只列事实，处置留给裁决</text>

  <rect x="60" y="993" width="1000" height="152" rx="10" fill="#1A0F13" stroke="#5C2029" stroke-width="1.5"/>
  <rect x="60" y="993" width="5" height="152" rx="2.5" fill="#F45B69"/>
  <text x="82" y="1020" font-size="14" font-weight="700" fill="#F45B69">⛔ 幽灵条目 5 条：catalog 登记了、磁盘上不存在</text>
  <text x="82" y="1046" font-size="12.5" fill="#C9A7AD">confirm-before-coding　track-task-progress　github　manage-problem-log　manage-requirements</text>
  <text x="82" y="1072" font-size="12.5" fill="#C9A7AD">其中 3 条（github / manage-problem-log / manage-requirements）已穿透进「唯一真相源」执行层树，成为树上的幽灵节点。</text>
  <text x="82" y="1098" font-size="12.5" fill="#F45B69">而同一份树的 §4 一致性自检写着「一致性问题：无」—— verify-execution-tree 对「磁盘不存在」这一类没有校验，属判定盲区。</text>
  <text x="82" y="1126" font-size="12" fill="#9FB3CC">另有空洞：api 层 0 条、mcp 层 0 条（闭集内的两个空层）；磁盘 178 目录中 1 个是脚手架 _template，按口径不算能力。</text>

