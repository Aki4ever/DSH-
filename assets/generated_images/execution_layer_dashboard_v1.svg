  <rect x="60" y="1377" width="1000" height="44" rx="8" fill="#1E1A0E" stroke="#4A3D14" stroke-width="1.5"/>
  <text x="80" y="1405" font-size="13" fill="#FFB900">⚠️ 六层完整性</text>
  <text x="240" y="1405" font-size="13" fill="#EAF2FA">api 0 · mcp 0 —— 两个空层，闭集有定义但无实体</text>
  <text x="846" y="1405" font-size="11.5" fill="#5F7189">execution-layers.json</text>

  <rect x="60" y="1429" width="1000" height="44" rx="8" fill="#231016" stroke="#5C2029" stroke-width="1.5"/>
  <text x="80" y="1457" font-size="13" fill="#F45B69">⛔ 树一致性</text>
  <text x="240" y="1457" font-size="13" fill="#EAF2FA">自检报「无问题」，但树内含 3 条磁盘不存在的幽灵节点</text>
  <text x="846" y="1457" font-size="11.5" fill="#5F7189">execution-tree.md §4</text>

