  <!-- ══ 头部 ══ -->
  <text x="60" y="70" font-size="38" font-weight="700" fill="#EAF2FA">执行层盘点仪表盘</text>
  <text x="60" y="103" font-size="15" fill="#8A98AC">六层闭集口径 · 全部数字来自 5 个登记 JSON 与 2 条实跑命令，无一处人工估计</text>
  <rect x="790" y="28" width="270" height="88" rx="10" fill="#101827" stroke="#233046" stroke-width="1.5"/>
  <text x="810" y="54" font-size="13" fill="#7C8CA3">实测快照</text>
  <text x="810" y="78" font-size="15" font-weight="700" fill="#EAF2FA">2026-09-29 · v4.23.0</text>
  <text x="810" y="99" font-size="12" fill="#2EC4B6">catalog 2.0.0 · tree 1.0.0</text>

  <!-- ══ ① 六层分布 ══ -->
  <rect x="60" y="140" width="6" height="24" rx="3" fill="#00D2FF"/>
  <text x="80" y="161" font-size="22" font-weight="700" fill="#EAF2FA">① 六层闭集分布（执行层的全部家底）</text>
  <text x="640" y="161" font-size="13" fill="#7C8CA3">层名出处：capability_naming_spec.md §二 · 登记：execution-layers.json</text>

  <rect x="60" y="185" width="157" height="150" rx="10" fill="#0F1A24" stroke="#1F4A44" stroke-width="1.5"/>
  <text x="76" y="213" font-size="13" font-weight="700" fill="#2EC4B6">skill 技能层</text>
  <text x="76" y="262" font-size="40" font-weight="700" fill="#EAF2FA">182</text>
  <text x="76" y="290" font-size="11.5" fill="#9FB3CC">自动派生自 catalog</text>
  <text x="76" y="312" font-size="11.5" fill="#5F7189">执行层主体，唯一实</text>
  <text x="76" y="328" font-size="11.5" fill="#5F7189">体超百的一层。</text>

  <rect x="228" y="185" width="157" height="150" rx="10" fill="#0F1A24" stroke="#1F4A44" stroke-width="1.5"/>
  <text x="244" y="213" font-size="13" font-weight="700" fill="#2EC4B6">cli 命令层</text>
  <text x="244" y="262" font-size="40" font-weight="700" fill="#EAF2FA">9</text>
  <text x="244" y="290" font-size="11.5" fill="#9FB3CC">手工登记</text>
  <text x="244" y="312" font-size="11.5" fill="#5F7189">skill-pool 主入口 +</text>
  <text x="244" y="328" font-size="11.5" fill="#5F7189">8 个子命令。</text>

  <rect x="396" y="185" width="157" height="150" rx="10" fill="#0F1A24" stroke="#1F4A44" stroke-width="1.5"/>
  <text x="412" y="213" font-size="13" font-weight="700" fill="#2EC4B6">agent 智能体层</text>
  <text x="412" y="262" font-size="40" font-weight="700" fill="#EAF2FA">4</text>
  <text x="412" y="290" font-size="11.5" fill="#9FB3CC">手工登记</text>
  <text x="412" y="312" font-size="11.5" fill="#5F7189">宿主 3（subagent /</text>
  <text x="412" y="328" font-size="11.5" fill="#5F7189">workflow / ralph）+ 仓库 1。</text>

  <rect x="564" y="185" width="157" height="150" rx="10" fill="#1E1A0E" stroke="#4A3D14" stroke-width="1.5"/>
  <text x="580" y="213" font-size="13" font-weight="700" fill="#FFB900">api 接口层</text>
  <text x="580" y="262" font-size="40" font-weight="700" fill="#FFB900">0</text>
  <text x="580" y="290" font-size="11.5" fill="#9FB3CC">空层</text>
  <text x="580" y="312" font-size="11.5" fill="#5F7189">闭集里存在、实体为</text>
  <text x="580" y="328" font-size="11.5" fill="#5F7189">零：只靠脚本入口承载。</text>

  <rect x="732" y="185" width="157" height="150" rx="10" fill="#1E1A0E" stroke="#4A3D14" stroke-width="1.5"/>
  <text x="748" y="213" font-size="13" font-weight="700" fill="#FFB900">mcp 协议层</text>
  <text x="748" y="262" font-size="40" font-weight="700" fill="#FFB900">0</text>
  <text x="748" y="290" font-size="11.5" fill="#9FB3CC">空层</text>
  <text x="748" y="312" font-size="11.5" fill="#5F7189">暂无 MCP 协议面，</text>
  <text x="748" y="328" font-size="11.5" fill="#5F7189">生态索引中为规划项。</text>

  <rect x="900" y="185" width="160" height="150" rx="10" fill="#0F1A24" stroke="#1F4A44" stroke-width="1.5"/>
  <text x="916" y="213" font-size="13" font-weight="700" fill="#2EC4B6">plugin 插件层</text>
  <text x="916" y="262" font-size="40" font-weight="700" fill="#EAF2FA">1</text>
  <text x="916" y="290" font-size="11.5" fill="#9FB3CC">手工登记</text>
  <text x="916" y="312" font-size="11.5" fill="#5F7189">dsh-plugin-control-</text>
  <text x="916" y="328" font-size="11.5" fill="#5F7189">jump（调控按钮）。</text>

  <text x="60" y="360" font-size="12" fill="#5F7189">注：执行层树声明 skill 层「自动派生」，故 execution-layers.json 只手工登记非技能层 14 条（cli 9 + agent 4 + plugin 1）—— 这是避免双登记的设计，不是漏登记。</text>

  <!-- ══ ② 四口径对照 + 覆盖率环 ══ -->
  <rect x="60" y="392" width="6" height="24" rx="3" fill="#2EC4B6"/>
  <text x="80" y="413" font-size="22" font-weight="700" fill="#EAF2FA">② 四个口径对照（对不上账都发生在这里）</text>
  <text x="700" y="413" font-size="13" fill="#7C8CA3">先分清口径，再谈缺口</text>

  <rect x="60" y="437" width="310" height="120" rx="10" fill="url(#cardbg)" stroke="#233046" stroke-width="1.5"/>
  <rect x="60" y="437" width="5" height="120" rx="2.5" fill="#00D2FF"/>
  <text x="80" y="465" font-size="14" font-weight="700" fill="#EAF2FA">磁盘实物口径</text>
  <text x="80" y="508" font-size="34" font-weight="700" fill="#00D2FF">178</text>
  <text x="152" y="508" font-size="13" fill="#9FB3CC">个技能目录</text>
  <text x="80" y="534" font-size="11.5" fill="#5F7189">含 _template 脚手架 1 个（索引已显式排除）</text>

  <rect x="386" y="437" width="310" height="120" rx="10" fill="url(#cardbg)" stroke="#233046" stroke-width="1.5"/>
  <rect x="386" y="437" width="5" height="120" rx="2.5" fill="#A17BFF"/>
  <text x="406" y="465" font-size="14" font-weight="700" fill="#EAF2FA">catalog 登记口径</text>
  <text x="406" y="508" font-size="34" font-weight="700" fill="#A17BFF">182</text>
  <text x="478" y="508" font-size="13" fill="#9FB3CC">条技能</text>
  <text x="406" y="534" font-size="11.5" fill="#5F7189">L1 43 · L2 95 · L3 43 · L4 1</text>

  <rect x="712" y="437" width="348" height="120" rx="10" fill="url(#cardbg)" stroke="#233046" stroke-width="1.5"/>
  <rect x="712" y="437" width="5" height="120" rx="2.5" fill="#2EC4B6"/>
  <text x="732" y="465" font-size="14" font-weight="700" fill="#EAF2FA">索引口径（执行层 → 索引层）</text>
  <text x="732" y="508" font-size="34" font-weight="700" fill="#2EC4B6">224</text>
  <text x="806" y="508" font-size="13" fill="#9FB3CC">条 = 技能 177 + agent/plugin/cli 47</text>
  <text x="732" y="534" font-size="11.5" fill="#5F7189">由 build_capabilities_index.mjs --check 认定</text>

  <rect x="60" y="573" width="1000" height="98" rx="10" fill="#17110A" stroke="#5A3A12" stroke-width="1.5"/>
  <rect x="60" y="573" width="5" height="98" rx="2.5" fill="#FFB900"/>
  <text x="82" y="600" font-size="14" font-weight="700" fill="#FFD166">口径落差公式：catalog 182 − 索引 177 = 5（幽灵条目）　·　索引 177 + 脚手架 1 = 磁盘 178（自洽）</text>
  <text x="82" y="626" font-size="12" fill="#BFAE8E">三个总数不是三个错误，而是三种统计范围：磁盘数目录、catalog 数登记、索引数被索引层收纳的能力条目。真正的缺口只有一个 —— 那 5 条幽灵。</text>
  <text x="82" y="650" font-size="12" fill="#BFAE8E">覆盖率判定：224 条执行层 · 已收录 224 · 未收录 0 —— 索引层没有漏掉任何在盘能力。</text>

