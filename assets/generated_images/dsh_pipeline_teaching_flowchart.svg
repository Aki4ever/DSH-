  <!-- 全局大背景 -->
  <rect width="920" height="700" rx="16" fill="url(#flowBg)"/>
  <rect x="1.5" y="1.5" width="917" height="697" rx="14.5" stroke="#1F2937" stroke-width="1.5"/>
  <rect x="40" y="2" width="840" height="2" fill="url(#flowLineGrad)"/>

  <!-- 顶部标题与元数据 -->
  <g transform="translate(40, 24)">
    <circle cx="12" cy="16" r="7" fill="#34D399"/>
    <text x="32" y="23" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" letter-spacing="0.5">DSH 任务执行闭环与十六步流水线教学图</text>
    <text x="565" y="22" fill="#34D399" font-family="sans-serif" font-size="12" font-weight="700">· 双轨分流与不可跳步工序</text>
    <rect x="740" y="5" width="100" height="24" rx="12" fill="#0E2421" stroke="#34D399" stroke-width="1"/>
    <text x="790" y="21" text-anchor="middle" fill="#34D399" font-family="sans-serif" font-size="11" font-weight="700">闭环教学法典</text>
  </g>

  <!-- 双轨分流横幅指示器 -->
  <g transform="translate(40, 64)">
    <rect width="840" height="42" rx="8" fill="#131B28" stroke="#253347" stroke-width="1"/>
    <text x="18" y="26" fill="#94A3B8" font-family="sans-serif" font-size="12" font-weight="700">双轨分流决策：</text>
    
    <rect x="110" y="7" width="345" height="28" rx="5" fill="#101F35" stroke="#0284C7" stroke-width="1"/>
    <text x="120" y="25" fill="#38BDF8" font-family="sans-serif" font-size="11" font-weight="700">快轨 (难度 ≤ 35分)</text>
    <text x="235" y="25" fill="#BAE6FD" font-family="sans-serif" font-size="11">极简三步: 【探】➔【攻】➔【归】</text>

    <rect x="465" y="7" width="365" height="28" rx="5" fill="#1C182A" stroke="#7C3AED" stroke-width="1"/>
    <text x="475" y="25" fill="#C084FC" font-family="sans-serif" font-size="11" font-weight="700">慢轨 (难度 > 35分)</text>
    <text x="590" y="25" fill="#E9D5FF" font-family="sans-serif" font-size="11">严密十六步: 探 ➔ 定 ➔ 筹 ➔ 攻 ➔ 验 ➔ 归</text>
  </g>

  <!-- 六大阶段卡片网格 (2行 x 3列) -->

  <!-- 阶段 1：【探境】(Exploration) -->
  <g transform="translate(40, 120)">
    <rect width="268" height="235" rx="10" fill="url(#phaseCard1)" stroke="#0284C7" stroke-width="1.2"/>
    <rect x="12" y="12" width="28" height="28" rx="6" fill="#0284C7" opacity="0.2"/>
    <text x="26" y="32" text-anchor="middle" fill="#38BDF8" font-family="sans-serif" font-size="16" font-weight="900">一</text>
    <text x="48" y="31" fill="#FFFFFF" font-family="sans-serif" font-size="15" font-weight="700">【探境】环境自检与基线</text>
    <line x1="12" y1="48" x2="256" y2="48" stroke="#1E293B" stroke-width="1"/>

    <g transform="translate(14, 60)">
      <rect width="240" height="38" rx="5" fill="#081424" stroke="#1E3A5F" stroke-width="1"/>
      <text x="10" y="18" fill="#38BDF8" font-family="sans-serif" font-size="11" font-weight="700">S01 环境权限与安全自检</text>
      <text x="10" y="31" fill="#94A3B8" font-family="sans-serif" font-size="10">核查 DSH 沙箱模式与免审批策略</text>
    </g>

    <g transform="translate(14, 106)">
      <rect width="240" height="38" rx="5" fill="#081424" stroke="#1E3A5F" stroke-width="1"/>
      <text x="10" y="18" fill="#38BDF8" font-family="sans-serif" font-size="11" font-weight="700">S02 干道路由与业务基线</text>
      <text x="10" y="31" fill="#94A3B8" font-family="sans-serif" font-size="10">命中 G0/G1 干道，严防与设定冲突</text>
    </g>

    <g transform="translate(14, 154)">
      <rect width="240" height="66" rx="5" fill="#060F1C"/>
      <text x="8" y="18" fill="#64748B" font-family="sans-serif" font-size="10" font-weight="700">★ 门禁证据与交付物：</text>
      <text x="8" y="34" fill="#94A3B8" font-family="sans-serif" font-size="10">输出安全自检备忘与干道声明；</text>
      <text x="8" y="50" fill="#94A3B8" font-family="sans-serif" font-size="10">若发现业务设定冲突，立即阻断！</text>
    </g>
  </g>

  <!-- 阶段 2：【定标】(Targeting) -->
  <g transform="translate(326, 120)">
    <rect width="268" height="235" rx="10" fill="url(#phaseCard2)" stroke="#D97706" stroke-width="1.2"/>
    <rect x="12" y="12" width="28" height="28" rx="6" fill="#D97706" opacity="0.2"/>
    <text x="26" y="32" text-anchor="middle" fill="#FBBF24" font-family="sans-serif" font-size="16" font-weight="900">二</text>
    <text x="48" y="31" fill="#FFFFFF" font-family="sans-serif" font-size="15" font-weight="700">【定标】意图提炼与命名</text>
    <line x1="12" y1="48" x2="256" y2="48" stroke="#2D2115" stroke-width="1"/>

    <g transform="translate(14, 60)">
      <rect width="240" height="38" rx="5" fill="#181208" stroke="#4A3416" stroke-width="1"/>
      <text x="10" y="18" fill="#FBBF24" font-family="sans-serif" font-size="11" font-weight="700">S03/S04 意图查重与双螺旋打分</text>
      <text x="10" y="31" fill="#94A3B8" font-family="sans-serif" font-size="10">价值 60分模型 + 难度 100分模型</text>
    </g>

    <g transform="translate(14, 106)">
      <rect width="240" height="38" rx="5" fill="#181208" stroke="#EA580C" stroke-width="1"/>
      <text x="10" y="18" fill="#FB923C" font-family="sans-serif" font-size="11" font-weight="700">S05 首动握手重命名门禁 🚨</text>
      <text x="10" y="31" fill="#FED7AA" font-family="sans-serif" font-size="10">首个工具必调 rename_session (8字)</text>
    </g>

    <g transform="translate(14, 154)">
      <rect width="240" height="66" rx="5" fill="#120D06"/>
      <text x="8" y="18" fill="#64748B" font-family="sans-serif" font-size="10" font-weight="700">★ 门禁证据与交付物：</text>
      <text x="8" y="34" fill="#94A3B8" font-family="sans-serif" font-size="10">会话标题锁定回执 (session.rename)；</text>
      <text x="8" y="50" fill="#94A3B8" font-family="sans-serif" font-size="10">S06 输出视口 Sticky 置顶工单卡片</text>
    </g>
  </g>

  <!-- 阶段 3：【筹策】(Planning) -->
