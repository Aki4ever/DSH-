    <g transform="translate(14, 98)">
      <rect width="240" height="34" rx="5" fill="#130C1E" stroke="#482269" stroke-width="1"/>
      <text x="10" y="16" fill="#C084FC" font-family="sans-serif" font-size="11" font-weight="700">S10/S11 原子编写与读回 (Read-Back)</text>
      <text x="10" y="28" fill="#94A3B8" font-family="sans-serif" font-size="10">write / edit 精准微调，写后必读回！</text>
    </g>

    <g transform="translate(14, 138)">
      <rect width="240" height="82" rx="5" fill="#0C0714"/>
      <text x="8" y="16" fill="#C084FC" font-family="sans-serif" font-size="10" font-weight="700">多智能体分流调用：</text>
      <text x="8" y="32" fill="#94A3B8" font-family="sans-serif" font-size="10">· subagent: 独立隔离审查</text>
      <text x="8" y="47" fill="#94A3B8" font-family="sans-serif" font-size="10">· subagent_fork: 继承上下文攻坚</text>
      <text x="8" y="62" fill="#94A3B8" font-family="sans-serif" font-size="10">· workflow: 并发流水线 | ralph 自愈</text>
    </g>
  </g>

  <!-- 阶段 5：【质检】(Verification) -->
  <g transform="translate(326, 370)">
    <rect width="268" height="235" rx="10" fill="url(#phaseCard5)" stroke="#E11D48" stroke-width="1.2"/>
    <rect x="12" y="12" width="28" height="28" rx="6" fill="#E11D48" opacity="0.2"/>
    <text x="26" y="32" text-anchor="middle" fill="#FB7185" font-family="sans-serif" font-size="16" font-weight="900">五</text>
    <text x="48" y="31" fill="#FFFFFF" font-family="sans-serif" font-size="15" font-weight="700">【质检】功能跑通与联动</text>
    <line x1="12" y1="48" x2="256" y2="48" stroke="#4C1425" stroke-width="1"/>

    <g transform="translate(14, 60)">
      <rect width="240" height="38" rx="5" fill="#1C0A12" stroke="#5C162E" stroke-width="1"/>
      <text x="10" y="18" fill="#FB7185" font-family="sans-serif" font-size="11" font-weight="700">S12 工程与脚本真实跑通</text>
      <text x="10" y="31" fill="#94A3B8" font-family="sans-serif" font-size="10">必须输出真实命令执行与测试回执</text>
    </g>

    <g transform="translate(14, 106)">
      <rect width="240" height="38" rx="5" fill="#1C0A12" stroke="#5C162E" stroke-width="1"/>
      <text x="10" y="18" fill="#FB7185" font-family="sans-serif" font-size="11" font-weight="700">S13 关联存量文件联动排查</text>
      <text x="10" y="31" fill="#94A3B8" font-family="sans-serif" font-size="10">消除死链、文本冲突或旧版本残留</text>
