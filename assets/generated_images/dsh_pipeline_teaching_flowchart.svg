    <text x="48" y="31" fill="#FFFFFF" font-family="sans-serif" font-size="15" font-weight="700">【筹策】步骤拆解与边界</text>
    <line x1="12" y1="48" x2="256" y2="48" stroke="#16382F" stroke-width="1"/>

    <g transform="translate(14, 60)">
