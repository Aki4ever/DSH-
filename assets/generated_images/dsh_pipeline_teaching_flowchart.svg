      <stop offset="0%" stop-color="#090D14"/>
      <stop offset="50%" stop-color="#101723"/>
      <stop offset="100%" stop-color="#06090E"/>
    </linearGradient>
    <linearGradient id="flowLineGrad" x1="0" y1="0" x2="920" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="25%" stop-color="#FBBF24"/>
      <stop offset="50%" stop-color="#34D399"/>
      <stop offset="75%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="phaseCard1" x1="0" y1="0" x2="260" y2="230" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#101E30"/>
      <stop offset="100%" stop-color="#0B1320"/>
    </linearGradient>
    <linearGradient id="phaseCard2" x1="0" y1="0" x2="260" y2="230" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#221C11"/>
      <stop offset="100%" stop-color="#141009"/>
    </linearGradient>
    <linearGradient id="phaseCard3" x1="0" y1="0" x2="260" y2="230" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0E2421"/>
      <stop offset="100%" stop-color="#081715"/>
    </linearGradient>
    <linearGradient id="phaseCard4" x1="0" y1="0" x2="260" y2="230" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1A1226"/>
      <stop offset="100%" stop-color="#100A19"/>
    </linearGradient>
    <linearGradient id="phaseCard5" x1="0" y1="0" x2="260" y2="230" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#28111A"/>
      <stop offset="100%" stop-color="#18090F"/>
    </linearGradient>
    <linearGradient id="phaseCard6" x1="0" y1="0" x2="260" y2="230" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10252D"/>
      <stop offset="100%" stop-color="#09161B"/>
