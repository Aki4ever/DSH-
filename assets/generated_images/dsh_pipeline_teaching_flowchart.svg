      <text x="10" y="31" fill="#94A3B8" font-family="sans-serif" font-size="10">调用 todo_write (单在办单一推进)</text>
    </g>

    <g transform="translate(14, 106)">
      <rect width="240" height="38" rx="5" fill="#091815" stroke="#174E43" stroke-width="1"/>
      <text x="10" y="18" fill="#34D399" font-family="sans-serif" font-size="11" font-weight="700">S08 原子边界与回滚预案</text>
      <text x="10" y="31" fill="#94A3B8" font-family="sans-serif" font-size="10">框定受影响文件，明确异常回滚策略</text>
    </g>

    <g transform="translate(14, 154)">
      <rect width="240" height="66" rx="5" fill="#061210"/>
      <text x="8" y="18" fill="#64748B" font-family="sans-serif" font-size="10" font-weight="700">★ 门禁证据与交付物：</text>
      <text x="8" y="34" fill="#94A3B8" font-family="sans-serif" font-size="10">完整的全周期结构化任务列表；</text>
      <text x="8" y="50" fill="#94A3B8" font-family="sans-serif" font-size="10">零在办非法状态防范与状态同步</text>
    </g>
  </g>

  <!-- 第二行：阶段 4、5、6 -->

  <!-- 阶段 4：【攻坚】(Execution) -->
  <g transform="translate(40, 370)">
    <rect width="268" height="235" rx="10" fill="url(#phaseCard4)" stroke="#7C3AED" stroke-width="1.2"/>
    <rect x="12" y="12" width="28" height="28" rx="6" fill="#7C3AED" opacity="0.2"/>
    <text x="26" y="32" text-anchor="middle" fill="#C084FC" font-family="sans-serif" font-size="16" font-weight="900">四</text>
    <text x="48" y="31" fill="#FFFFFF" font-family="sans-serif" font-size="15" font-weight="700">【攻坚】精准落地与协同</text>
    <line x1="12" y1="48" x2="256" y2="48" stroke="#371E4A" stroke-width="1"/>

    <g transform="translate(14, 58)">
      <rect width="240" height="34" rx="5" fill="#130C1E" stroke="#482269" stroke-width="1"/>
