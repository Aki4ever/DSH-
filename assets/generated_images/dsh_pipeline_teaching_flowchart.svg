    <g transform="translate(14, 154)">
      <rect width="240" height="66" rx="5" fill="#13060C"/>
      <text x="8" y="18" fill="#64748B" font-family="sans-serif" font-size="10" font-weight="700">★ 门禁证据与交付物：</text>
      <text x="8" y="34" fill="#94A3B8" font-family="sans-serif" font-size="10">杜绝假设性通过，报错必三段式释义；</text>
      <text x="8" y="50" fill="#94A3B8" font-family="sans-serif" font-size="10">两步无进展立即启动熔断与回滚防护</text>
    </g>
  </g>

  <!-- 阶段 6：【归卷】(Roll-in) -->
  <g transform="translate(612, 370)">
    <rect width="268" height="235" rx="10" fill="url(#phaseCard6)" stroke="#0D9488" stroke-width="1.2"/>
    <rect x="12" y="12" width="28" height="28" rx="6" fill="#0D9488" opacity="0.2"/>
    <text x="26" y="32" text-anchor="middle" fill="#2DD4BF" font-family="sans-serif" font-size="16" font-weight="900">六</text>
    <text x="48" y="31" fill="#FFFFFF" font-family="sans-serif" font-size="15" font-weight="700">【归卷】原子提交与审计</text>
    <line x1="12" y1="48" x2="256" y2="48" stroke="#163F3C" stroke-width="1"/>

    <g transform="translate(14, 58)">
      <rect width="240" height="34" rx="5" fill="#0A181C" stroke="#164E54" stroke-width="1"/>
      <text x="10" y="16" fill="#2DD4BF" font-family="sans-serif" font-size="11" font-weight="700">S14 三位一体原子回写</text>
      <text x="10" y="28" fill="#94A3B8" font-family="sans-serif" font-size="10">需求台账 + 规则知识库 + 版本号同步</text>
    </g>

    <g transform="translate(14, 98)">
      <rect width="240" height="34" rx="5" fill="#0A181C" stroke="#164E54" stroke-width="1"/>
      <text x="10" y="16" fill="#2DD4BF" font-family="sans-serif" font-size="11" font-weight="700">S15 Git 语义化提交与推送</text>
      <text x="10" y="28" fill="#94A3B8" font-family="sans-serif" font-size="10">feat/docs/refactor 严格语义化提交</text>
    </g>

    <g transform="translate(14, 138)">
      <rect width="240" height="82" rx="5" fill="#061114"/>
      <text x="8" y="16" fill="#2DD4BF" font-family="sans-serif" font-size="10" font-weight="700">S16 交付入口与效率审计：</text>
      <text x="8" y="32" fill="#94A3B8" font-family="sans-serif" font-size="10">· 交付直达卡片 (图片/链接/命令直达)</text>
      <text x="8" y="47" fill="#94A3B8" font-family="sans-serif" font-size="10">· 输出 M1~M6 效率量化审计看板</text>
      <text x="8" y="62" fill="#94A3B8" font-family="sans-serif" font-size="10">· 记录 memory/efficiency_audit_log.md</text>
    </g>
  </g>

  <!-- 底部教学图注栏 -->
  <g transform="translate(40, 620)">
    <rect width="840" height="60" rx="8" fill="#0C1017" stroke="#1F2937" stroke-width="1"/>
    <circle cx="20" cy="30" r="5" fill="#34D399"/>
    <text x="34" y="34" fill="#94A3B8" font-family="sans-serif" font-size="12" font-weight="700">核心执行铁律：</text>
    <text x="135" y="34" fill="#E2E8F0" font-family="sans-serif" font-size="11">
      <tspan fill="#38BDF8">门禁在先</tspan> ➔ 
      <tspan fill="#FBBF24">8字定名</tspan> ➔ 
      <tspan fill="#34D399">单指纹读取</tspan> ➔ 
      <tspan fill="#C084FC">写后必读回</tspan> ➔ 
      <tspan fill="#FB7185">真机跑通</tspan> ➔ 
      <tspan fill="#2DD4BF">原子三位归卷与M1~M6审计</tspan>
    </text>
  </g>
</svg>